name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: make compile PYTHON=python
      - name: Run unit tests
        run: make test PYTHON=python
      - name: List report types
        run: make list-reports PYTHON=python
      - name: Scan for credentials
        run: make secret-scan PYTHON=python
