name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CJK rendering fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: make compile PYTHON=python
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          make test PYTHON=python 2>&1 | tee /tmp/daily-briefing-unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 25 /tmp/daily-briefing-unit-tests.log | tr '\n' ' ')
            echo "::error title=Unit tests failed::$summary"
            exit "$status"
          fi
      - name: List report types
        run: make list-reports PYTHON=python
      - name: Scan for credentials
        run: make secret-scan PYTHON=python
